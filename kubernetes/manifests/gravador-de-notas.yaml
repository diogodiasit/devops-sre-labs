# Primeira etapa do teste de persistência: grava um arquivo no volume do PVC.
# Depois este Pod é removido, e o leitor-de-notas confere se o arquivo continua lá.
apiVersion: v1
kind: Pod
metadata:
  name: gravador-de-notas
spec:
  volumes:
    - name: dados
      persistentVolumeClaim:
        claimName: pvc-dados
  containers:
    - name: escritor
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Esta nota deve sobreviver ao pod' > /dados/nota.txt && sleep 3600"]
      volumeMounts:
        - name: dados          # liga ao volume declarado acima pelo nome
          mountPath: /dados
