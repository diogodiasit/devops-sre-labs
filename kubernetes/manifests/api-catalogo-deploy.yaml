# Aplicação usada no teste de HPA. A imagem hpa-example faz um cálculo pesado a cada
# requisição, então a CPU sobe rápido sob carga.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-catalogo
spec:
  # Sem "replicas": quem controla a quantidade é o HPA. Com o campo aqui, cada
  # kubectl apply (ou pipeline) devolveria o valor fixo e entraria em conflito com ele.
  selector:
    matchLabels:
      app: api-catalogo
  template:
    metadata:
      labels:
        app: api-catalogo
    spec:
      containers:
        - name: catalogo
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80
          resources:
            # O scheduler usa os requests para escolher o node, e o HPA calcula
            # a utilização como % deles. Sem requests de CPU o HPA fica <unknown>.
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 500m          # acima disso o container sofre throttling
              memory: 128Mi      # igual ao request: evita depender de memória ociosa do node e ser OOMKilled
---
apiVersion: v1
kind: Service
metadata:
  name: svc-catalogo
spec:
  selector:
    app: api-catalogo            # inclui automaticamente os Pods novos criados pelo HPA
  ports:
    - port: 80
      targetPort: 80
