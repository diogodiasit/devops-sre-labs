# ConfigMap e Secret consumidos por vitrine.yaml (como variáveis) e vitrine-arq.yaml (como arquivos).
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-app
data:
  DB_SERVER: "banco-novo"
  DB_USER: "app_loja"
---
apiVersion: v1
kind: Secret
metadata:
  name: segredo-app
type: Opaque
stringData:                       # texto puro aqui; o Kubernetes grava em base64
  DB_PASSWORD: "senha-de-exemplo" # valor fictício de lab; em produção viria de um cofre (Key Vault)
