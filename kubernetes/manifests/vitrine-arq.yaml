# Mesmo Secret do vitrine.yaml, mas entregue como arquivos em /etc/segredos:
# cada chave vira um arquivo (DB_PASSWORD -> /etc/segredos/DB_PASSWORD).
# O Secret já precisa existir (criado por config-teste.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitrine-arq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vitrine-arq
  template:
    metadata:
      labels:
        app: vitrine-arq
    spec:
      containers:
      - name: vitrine-arq
        image: busybox:1.36
        command: ["sleep", "3600"]
        volumeMounts:
        - name: pasta-segredos     # liga ao volume de mesmo nome abaixo
          mountPath: /etc/segredos
          readOnly: true
      volumes:
      - name: pasta-segredos
        secret:
          secretName: segredo-app
