# nginx com 3 réplicas e um Service ClusterIP na frente.
# O Service encontra os Pods pela label app=loja-frontend, não pelo nome do Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loja-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: loja-frontend
  template:
    metadata:
      labels:
        app: loja-frontend
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-loja-frontend        # também é o nome DNS interno do Service
spec:
  selector:
    app: loja-frontend
  ports:
  - port: 80
    targetPort: 80
