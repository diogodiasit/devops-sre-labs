# Segunda etapa do teste de persistência: um Pod novo monta o mesmo PVC.
# Ele não escreve nada, então o que estiver em /dados/nota.txt veio do gravador-de-notas.
apiVersion: v1
kind: Pod
metadata:
  name: leitor-de-notas
spec:
  volumes:
    - name: dados
      persistentVolumeClaim:
        claimName: pvc-dados
  containers:
    - name: leitor
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: dados
          mountPath: /dados
