# Roteamento por caminho: /app1 e /app2 vão para Services diferentes.
# Sem "host", a regra vale para qualquer endereço, o que facilita o teste local.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-teste
spec:
  ingressClassName: nginx        # controller que aplica estas regras (ingress-nginx do minikube)
  rules:
  - http:
      paths:
      - path: /app1
        pathType: Prefix         # casa /app1 e tudo abaixo dele (/app1/...)
        backend:
          service:
            name: svc-app1
            port:
              number: 80
      - path: /app2
        pathType: Prefix
        backend:
          service:
            name: svc-app2
            port:
              number: 80
