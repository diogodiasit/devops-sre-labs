# HPA do api-catalogo: mantém a CPU média dos Pods em 50% do request (100m de 200m),
# entre 2 e 8 réplicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: escalador-catalogo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-catalogo
  minReplicas: 2                 # mínimo de 2 para não ficar com um único ponto de falha
  maxReplicas: 8                 # teto para proteger o cluster e o custo
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      # 300 s já é o padrão; deixei explícito porque foi essa janela que observei
      # no lab antes de o HPA voltar de 6 para 2 Pods.
      stabilizationWindowSeconds: 300
