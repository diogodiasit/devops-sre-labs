# Readiness probe: o Pod só recebe tráfego do Service quando /tmp/pronto existe.
# Para testar, crie e apague o arquivo com kubectl exec e acompanhe a coluna READY:
# ela alterna entre 1/1 e 0/1, e RESTARTS continua em 0 (readiness não reinicia nada).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-readiness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-readiness
  template:
    metadata:
      labels:
        app: demo-readiness
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "3600"]
        readinessProbe:
          exec:
            command: ["cat", "/tmp/pronto"]   # código de saída 0 = pronto; diferente de 0 = fora do Service
          initialDelaySeconds: 2
          periodSeconds: 5
