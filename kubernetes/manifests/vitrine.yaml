# Recebe o ConfigMap config-app e o Secret segredo-app como variáveis de ambiente.
# Conferir com: kubectl exec deploy/vitrine -- env | grep DB_
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitrine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vitrine
  template:
    metadata:
      labels:
        app: vitrine
    spec:
      containers:
      - name: vitrine
        image: busybox:1.36
        command: ["sleep", "3600"]
        envFrom:                   # cada chave vira uma variável; mudanças só valem após recriar o Pod
        - configMapRef:
            name: config-app
        - secretRef:
            name: segredo-app
